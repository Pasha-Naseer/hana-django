{% extends 'shop/base.html '%}

{% block content %}
  <section id="billboard" class="bg-light py-5">
    <div class="container">
      <div class="row justify-content-center">
        <h1 class="section-title text-center mt-4" data-aos="fade-up">سفارشات ارسال نشده</h1>
        <div class="col-md-6 text-center" data-aos="fade-up" data-aos-delay="300">

            <table class="table table-striped table-hover table-bordered">
  <thead class="table-dark">
    <tr>

      <th scope="col">سفارش</th>
      <th scope="col">قیمت</th>
      <th scope="col">ایمیل مشتری</th>
      <th scope="col">تاریخ سفارش</th>
      <th scope="col">وضعیت ارسال</th>
    </tr>
  </thead>
  <tbody>
    {% for item in orders %}
    <tr>
      <td><a href="{% url 'payment:orders' item.id%}">{{ item.id }}</a></td>
      <td><a href="{% url 'payment:orders' item.id%}">{{ item.amount_paid }}</a></td>
      <td><a href="{% url 'payment:orders' item.id%}">{{ item.email }}</a></td>
      <td><a href="{% url 'payment:orders' item.id%}">{{ item.date_ordered }}</a></td>
      <td>
        <form method="POST">
          {% csrf_token %}
          <input type="hidden" name="shipping_status" value="true">
          <input type="hidden" name="num" value={{ item.id }}>
          <button type="submit" class="btn btn-success btn-sm">تغییر وضعیت به ارسال شده</button>


        </form>
      </td>
    </tr>
    {% endfor %}

  </tbody>
</table>

        </div>
      </div>
    </div>
  </section>




{% endblock %}
