{% extends 'shop/base.html '%}

{% block content %}
<section id="billboard" class="bg-light py-5">
  <div class="container">
    <div class="row justify-content-center">
      <h1 class="section-title text-center mt-4" data-aos="fade-up">سفارشات ارسال نشده</h1>
      <div class="col-md-10" data-aos="fade-up" data-aos-delay="300">

        <div class="card shadow-sm border-0 rounded-4">
          <div class="card-body p-4">

            <table class="table table-bordered align-middle text-center mb-0">
              <thead class="table-light">
                <tr>
                  <th scope="col">سفارش</th>
                  <th scope="col">قیمت</th>
                  <th scope="col">شماره تماس</th>
                  <th scope="col">تاریخ سفارش</th>
                  <th scope="col">وضعیت ارسال</th>
                </tr>
              </thead>
              <tbody>
                {% for item in orders %}
                <tr>
                  <td>
                    <a href="{% url 'payment:orders' item.id %}" class="text-decoration-none text-dark fw-semibold">
                      {{ item.id }}
                    </a>
                  </td>
                  <td>
                    <a href="{% url 'payment:orders' item.id %}" class="text-decoration-none text-dark">
                      {{ item.amount_paid }}
                    </a>
                  </td>
                  <td>
                    <a href="{% url 'payment:orders' item.id %}" class="text-decoration-none text-dark">
                      {{ item.email }}
                    </a>
                  </td>
                  <td>
                    <a href="{% url 'payment:orders' item.id %}" class="text-decoration-none text-dark">
                      {{ item.date_ordered }}
                    </a>
                  </td>
                  <td>
                    <form method="POST" class="d-inline">
                      {% csrf_token %}
                      <input type="hidden" name="shipping_status" value="true">
                      <input type="hidden" name="num" value={{ item.id }}>
                      <button type="submit" class="btn btn-outline-success btn-sm rounded-pill">
                        تغییر وضعیت به ارسال شده
                      </button>
                    </form>
                  </td>
                </tr>
                {% endfor %}
              </tbody>
            </table>

          </div>
        </div>

      </div>
    </div>
  </div>
</section>


{% endblock %}
