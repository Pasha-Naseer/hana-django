{% extends 'shop/base.html' %}
{% load static %}
{% block content %}
<style>
  :root{
    --cream:#FBF7F1;
    --paper:#FFFFFF;
    --wine:#7A0C1E;
    --wine-deep:#570815;
    --gold:#B08D57;
    --ink:#2B2320;
    --ink-soft:#6E655D;
    --line:#E9DFD1;
  }

  #comment-billboard{
    background:var(--cream);
    padding:56px 16px 72px;
    font-family:'VAZIRmatn', sans-serif;
    color:var(--ink);
    direction:rtl;
  }

  .comment-wrap{
    max-width:460px;
    margin:0 auto;
  }

  .comment-card{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:6px;
    overflow:hidden;
  }
  .comment-card-header{
    background:var(--cream);
    border-bottom:1px solid var(--line);
    padding:14px 24px;
    font-size:1rem;
    font-weight:700;
    color:var(--wine-deep);
    border-right:3px solid var(--gold);
  }
  .comment-card-body{
    padding:28px;
  }

  /* Django form fields */
  .comment-card-body form p{
    text-align:right;
    margin-bottom:16px;
  }
  .comment-card-body form label{
    display:block;
    font-size:0.88rem;
    color:var(--ink-soft);
    margin-bottom:6px;
  }
  .comment-card-body form input[type="text"],
  .comment-card-body form input[type="email"],
  .comment-card-body form input:not([type]),
  .comment-card-body form select,
  .comment-card-body form textarea{
    width:100%;
    border:1px solid var(--line);
    border-radius:4px;
    padding:10px 12px;
    font-family:inherit;
    font-size:0.9rem;
    background:var(--paper);
    color:var(--ink);
    box-sizing:border-box;
  }
  .comment-card-body form input:focus,
  .comment-card-body form select:focus,
  .comment-card-body form textarea:focus{
    outline:none;
    border-color:var(--gold);
  }
  .comment-card-body form textarea{
    min-height:110px;
    resize:vertical;
  }

  .comment-btn{
    display:block;
    width:100%;
    text-align:center;
    background:var(--wine);
    color:#fff;
    border:none;
    border-radius:4px;
    padding:12px 20px;
    font-size:0.95rem;
    font-weight:700;
    font-family:inherit;
    cursor:pointer;
    margin-top:6px;
    transition: background .2s ease;
  }
  .comment-btn:hover{
    background:var(--wine-deep);
  }
</style>

<section id="comment-billboard">
  <div class="comment-wrap">

    <div class="comment-card" data-aos="fade-up">
      <div class="comment-card-header">کامنت</div>
      <div class="comment-card-body">
        <form method="POST" action="{% url 'shop:comment' %}">
          {% csrf_token %}
          {{ form.as_p }}
          <button type="submit" class="comment-btn">ثبت</button>
        </form>
      </div>
    </div>

  </div>
</section>
{% endblock %}
