{% extends 'shop/base.html' %}

{% block content %}

    <section id="billboard" class="bg-light py-5">
    <div class="container">
      <div class="row justify-content-center">
           <div class="card" style="width: 40rem; padding:0px;" >
          <img class="card-img" src="{{ blog.blog_image.url }}" alt="Card image cap">
          </div>
        <h1 class="section-title text-center mt-4" data-aos="fade-up">{{ blog.title }}</h1>

        <div class="col-lg text-right" data-aos="fade-up" data-aos-delay="300">
            <strong style="color:#71706E">{{ blog.body|safe }}</strong>
        </div>
      </div>
    </div>
    </section>


{% endblock %}
