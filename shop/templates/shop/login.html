{% extends 'shop/base.html' %}

{% block content %}

  <section id="billboard" class="bg-light py-5">
    <div class="container">
      <div class="row justify-content-center">
        <h1 class="section-title text-center mt-4" data-aos="fade-up">ورود به حساب</h1>
        <div class="col-md-6 text-center" data-aos="fade-up" data-aos-delay="300">
          <form method="POST" action="{% url 'shop:login' %}">
            {% csrf_token %}
          <div class="form-group">
            <input type="text" class="form-control" placeholder="نام کاربری" name="username">
          </div>
            <br/>
          <div class="form-group">
            <input type="password" class="form-control" placeholder="رمز" name="password">
          </div>
            <br/>
          <button type="submit" class="btn btn-primary">ورود</button>
        </form>
        </div>
      </div>
    </div>
  </section>

{% endblock %}
