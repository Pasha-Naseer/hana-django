{% extends 'shop/base.html' %}

{% block content %}
<style>
  :root{
    --cream:#FBF7F1;
    --paper:#FFFFFF;
    --wine:#7A0C1E;
    --wine-deep:#570815;
    --gold:#B08D57;
    --ink:#2B2320;
    --ink-soft:#6E655D;
    --line:#E9DFD1;
  }

  #login-billboard{
    background:var(--cream);
    padding:56px 16px 72px;
    font-family:'VAZIRmatn', sans-serif;
    color:var(--ink);
    direction:rtl;
  }

  .login-wrap{
    max-width:460px;
    margin:0 auto;
  }

  .login-header{
    text-align:center;
    margin-bottom:36px;
  }
  .login-title{
    font-size:1.6rem;
    font-weight:700;
    color:var(--wine-deep);
    margin:0;
  }

  .login-card{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:6px;
    padding:32px 28px;
    text-align:center;
  }

  .login-field{
    margin-bottom:16px;
  }
  .login-input{
    width:100%;
    box-sizing:border-box;
    text-align:center;
    direction:rtl;
    border:1px solid var(--line);
    border-radius:4px;
    padding:12px;
    font-family:inherit;
    font-size:0.9rem;
    background:var(--paper);
    color:var(--ink);
    transition: border-color .2s ease;
  }
  .login-input::placeholder{
    color:var(--ink-soft);
  }
  .login-input:focus{
    outline:none;
    border-color:var(--gold);
  }

  .login-btn{
    display:block;
    width:100%;
    text-align:center;
    background:var(--wine);
    color:#fff;
    border:none;
    border-radius:4px;
    padding:13px 18px;
    font-size:0.98rem;
    font-weight:700;
    font-family:inherit;
    cursor:pointer;
    margin-top:10px;
    transition: background .2s ease;
  }
  .login-btn:hover{
    background:var(--wine-deep);
  }
</style>

<section id="login-billboard">
  <div class="login-wrap">

    <div class="login-header" data-aos="fade-up">
      <h1 class="login-title">ورود به حساب</h1>
    </div>

    <div class="login-card" data-aos="fade-up" data-aos-delay="200">
      <form method="POST" action="{% url 'shop:login' %}">
        {% csrf_token %}

        <div class="login-field">
          <input type="text" class="login-input" placeholder="نام کاربری" name="username">
        </div>

        <div class="login-field">
          <input type="password" class="login-input" placeholder="رمز" name="password">
        </div>

        <button type="submit" class="login-btn">ورود</button>
      </form>
    </div>

  </div>
</section>
{% endblock %}
