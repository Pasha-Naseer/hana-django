{% extends 'shop/base.html' %}

{% block content %}
<style>
  :root{
    --cream:#FBF7F1;
    --paper:#FFFFFF;
    --wine:#7A0C1E;
    --wine-deep:#570815;
    --gold:#B08D57;
    --ink:#2B2320;
    --ink-soft:#6E655D;
    --line:#E9DFD1;
  }

  #password-billboard{
    background:var(--cream);
    padding:56px 16px 72px;
    font-family:'VAZIRmatn', sans-serif;
    color:var(--ink);
    direction:rtl;
  }

  .password-wrap{
    max-width:460px;
    margin:0 auto;
  }

  .password-header{
    text-align:center;
    margin-bottom:36px;
  }
  .password-title{
    font-size:1.6rem;
    font-weight:700;
    color:var(--wine-deep);
    margin:0;
  }

  .password-card{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:6px;
    padding:32px 28px;
    text-align:center;
  }

  /* Django form fields */
  .password-card form p{
    text-align:right;
    margin-bottom:16px;
  }
  .password-card form label{
    display:block;
    font-size:0.88rem;
    color:var(--ink-soft);
    margin-bottom:6px;
  }
  .password-card form input[type="text"],
  .password-card form input[type="password"],
  .password-card form input:not([type]),
  .password-card form select{
    width:100%;
    border:1px solid var(--line);
    border-radius:4px;
    padding:10px 12px;
    font-family:inherit;
    font-size:0.9rem;
    background:var(--paper);
    color:var(--ink);
    box-sizing:border-box;
  }
  .password-card form input:focus,
  .password-card form select:focus{
    outline:none;
    border-color:var(--gold);
  }

  .password-btn{
    display:block;
    width:100%;
    text-align:center;
    background:var(--wine);
    color:#fff;
    border:none;
    border-radius:4px;
    padding:13px 18px;
    font-size:0.98rem;
    font-weight:700;
    font-family:inherit;
    cursor:pointer;
    margin-top:10px;
    transition: background .2s ease;
  }
  .password-btn:hover{
    background:var(--wine-deep);
  }
</style>

<section id="password-billboard">
  <div class="password-wrap">

    <div class="password-header" data-aos="fade-up">
      <h1 class="password-title">تغییر رمز کاربر</h1>
    </div>

    <div class="password-card" data-aos="fade-up" data-aos-delay="200">
      <form method="POST" action="{% url 'shop:update_password' %}">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="password-btn">تغییر رمز</button>
      </form>
    </div>

  </div>
</section>
{% endblock %}
