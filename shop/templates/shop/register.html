{% extends 'shop/base.html' %}

{% block content %}
<style>
  :root{
    --cream:#FBF7F1;
    --paper:#FFFFFF;
    --wine:#7A0C1E;
    --wine-deep:#570815;
    --gold:#B08D57;
    --ink:#2B2320;
    --ink-soft:#6E655D;
    --line:#E9DFD1;
  }

  #register-billboard{
    background:var(--cream);
    padding:56px 16px 72px;
    font-family:'VAZIRmatn', sans-serif;
    color:var(--ink);
    direction:rtl;
  }

  .register-wrap{
    max-width:460px;
    margin:0 auto;
  }

  .register-header{
    text-align:center;
    margin-bottom:36px;
  }
  .register-title{
    font-size:1.6rem;
    font-weight:700;
    color:var(--wine-deep);
    margin:0;
  }

  .register-card{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:6px;
    padding:32px 28px;
    text-align:center;
  }

  /* Django form fields */
  .register-card form p{
    text-align:right;
    margin-bottom:16px;
  }
  .register-card form label{
    display:block;
    font-size:0.88rem;
    color:var(--ink-soft);
    margin-bottom:6px;
  }
  .register-card form input[type="text"],
  .register-card form input[type="email"],
  .register-card form input[type="password"],
  .register-card form input[type="tel"],
  .register-card form input[type="number"],
  .register-card form input:not([type]),
  .register-card form select,
  .register-card form textarea{
    width:100%;
    border:1px solid var(--line);
    border-radius:4px;
    padding:10px 12px;
    font-family:inherit;
    font-size:0.9rem;
    background:var(--paper);
    color:var(--ink);
    box-sizing:border-box;
  }
  .register-card form input:focus,
  .register-card form select:focus,
  .register-card form textarea:focus{
    outline:none;
    border-color:var(--gold);
  }

  .register-btn{
    display:block;
    width:100%;
    text-align:center;
    background:var(--wine);
    color:#fff;
    border:none;
    border-radius:4px;
    padding:13px 18px;
    font-size:0.98rem;
    font-weight:700;
    font-family:inherit;
    cursor:pointer;
    margin-top:10px;
    transition: background .2s ease, transform .1s ease;
  }
  .register-btn:hover{
    background:var(--wine-deep);
  }
</style>

<section id="register-billboard">
  <div class="register-wrap">

    <div class="register-header" data-aos="fade-up">
      <h1 class="register-title">ثبت نام</h1>
    </div>

    <div class="register-card" data-aos="fade-up" data-aos-delay="200">
      <form method="POST" action="{% url 'shop:register' %}">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="register-btn">ثبت</button>
      </form>
    </div>

  </div>
</section>
{% endblock %}
